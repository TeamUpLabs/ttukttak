name: 버그 제보
description: 화면이 깨지거나, 눌러도 안 되거나, 값이 이상할 때
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      placeholder: 제출하기를 눌렀는데 "잠시 후 다시 시도해 주세요"만 떠요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 겪는 방법
      placeholder: |
        1. /submit 으로 가요
        2. 필수 항목을 채우고 제출하기를 눌러요
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 원래 어떻게 돼야 하나요?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 주소
      placeholder: https://…/p/…
  - type: dropdown
    id: device
    attributes:
      label: 기기
      options:
        - 데스크톱
        - 모바일
        - 둘 다
  - type: input
    id: browser
    attributes:
      label: 브라우저와 버전
      placeholder: Chrome 142, iOS Safari 26
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷 · 콘솔 오류
      description: 붙여 넣거나 끌어다 놓아요.
