name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새로 푸시하면 이전 실행은 멈춰요.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b && vite build
      - run: npm run build
